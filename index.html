<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小小兵機場出境大冒險</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1d3a;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:#222}
#app{position:relative;width:min(960px,100%);aspect-ratio:16/9;margin:12px auto;overflow:hidden;border-radius:14px;box-shadow:0 8px 30px #0008;background:#fff}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#000a;color:#fff;padding:16px;overflow:auto}
.scr[hidden]{display:none}
.scr.title{background:linear-gradient(#0005,#0008),url(assets/bg/title.jpg) center/cover}
.scr.hbs{justify-content:flex-start;background:#0b1d3a}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:#ffd400;color:#222;font-weight:700;margin:4px}
button:hover{background:#ffe55c}button:disabled{background:#bbb;cursor:not-allowed;opacity:.6}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.card{background:#fff;color:#222;border-radius:12px;padding:8px;width:130px}.card img{height:140px}
#dlg{position:absolute;left:10px;right:10px;bottom:10px;background:#fffffff2;border:3px solid #ffd400;border-radius:14px;display:flex;gap:12px;padding:10px 14px;max-height:80%;overflow:auto}
#dlg[hidden]{display:none}#dlg>img{height:150px;align-self:flex-end}
#dlg .nm{font-weight:700;color:#0a7a3a}#dlg .tx{line-height:1.6;margin:4px 0 8px}
#hb{background:#fff;color:#222;text-align:left;width:100%;max-width:820px;padding:20px;border-radius:12px;line-height:1.6}
#hb h3{border-bottom:2px solid #ffd400;margin:18px 0 6px}#hb small{color:#555}
@media print{body{background:#fff}#app{width:auto;aspect-ratio:auto;box-shadow:none;overflow:visible}canvas,#hud,#dlg,.noprint{display:none!important}.scr{position:static;background:#fff;color:#000;display:block;padding:0}}
</style></head><body>
<div id="app"><canvas id="c" width="960" height="540"></canvas><div id="hud"></div><div id="dlg" hidden></div><div id="scr" class="scr"></div></div>
<script src="data/questions.js"></script>
<script>
const D=window.DATA,W=960,H=540,ZW=700,FLOOR=190,NY=300,$=s=>document.querySelector(s),ctx=$('#c').getContext('2d');
const IMG={};['gru','agnes','edith','margo','bob','dave','carl','mel','tim','kevin','phil','stuart'].forEach(n=>{const i=new Image();i.src=`assets/characters/${n}.png`;IMG[n]=i});
const PL=[['gru','Gru'],['agnes','Agnes'],['edith','Edith'],['margo','Margo']];
const Z=[
['prep','出發前準備','bob','旅遊諮詢員','Bob','#d9ecff','Bello！我是旅遊諮詢員 Bob，歡迎來到機場！你這次想去哪裡旅行呢？'],
['checkin','報到劃位','dave','報到櫃檯人員','Dave','#e3f5dc','Banana！我是報到櫃檯人員 Dave，負責幫你報到劃位。先來考考你～'],
['baggage','託運行李','carl','行李地勤員','Carl','#fff1cf','Poopaye！行李要託運嗎？我是行李地勤員 Carl，來幫你秤重貼條碼！'],
['security','安全檢查','mel','安檢員','Mel','#f3dede','站住！我是安檢員 Mel，安檢要開始囉，請配合檢查！'],
['immigration','證照查驗','tim','移民官','Tim','#e6e0f5','護照和登機證請拿好，我是移民官 Tim，負責出境證照查驗。'],
['dutyfree','免稅店','stuart','免稅店店員','Stuart','#fde2ee','歡迎光臨免稅店！我是店員 Stuart，買東西之前，先回答我幾個小問題吧～'],
['gate','候機與登機門','kevin','登機門地勤','Kevin','#dcf3f3','登機門在這裡！我是登機門地勤 Kevin，快要登機啦～'],
['cabin','機艙內','phil','空服員','Phil','#d5e6ff','歡迎登機！我是空服員 Phil，起飛前來個機上安全小測驗吧！']
].map(a=>({id:a[0],title:a[1],npc:a[2],role:a[3],nm:a[4],color:a[5],hi:a[6]}));
const rnd=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const nx=i=>i*ZW+ZW/2,limit=()=>Math.min(G.cleared+1,Z.length)*ZW-40,hearts=()=>'♥'.repeat(G.hearts)+'♡'.repeat(3-G.hearts);
const SEEN=(()=>{try{return new Set(JSON.parse(localStorage.getItem('seenQ')||'[]'))}catch(e){return new Set()}})();
const mark=q=>{SEEN.add(q.id);try{localStorage.setItem('seenQ',JSON.stringify([...SEEN]))}catch(e){}};
const pickQ=(l,n)=>{const a=rnd(l);return[...a.filter(q=>!SEEN.has(q.id)),...a.filter(q=>SEEN.has(q.id))].slice(0,n)};
let G=null,keys={},t=0,near=-1,cam=0;

function screen(h,c=''){const s=$('#scr');s.className='scr '+c;s.innerHTML=h;s.hidden=false}
function title(){G=null;$('#hud').innerHTML='';screen('<h1>小小兵機場出境大冒險</h1><p>跟著小小兵，一關一關學會出境流程！</p><button onclick="select()">開始冒險</button>','title')}
function select(){screen(`<h2>選擇你的角色</h2><div class="cards">${PL.map(p=>`<div class="card"><img src="assets/characters/${p[0]}.png"><div>${p[1]}</div><button onclick="start('${p[0]}')">選我</button></div>`).join('')}</div>`)}
function start(n){G={ch:n,x:150,y:380,face:1,moving:false,cleared:0,hearts:3,country:null,log:[],qs:[],qi:0,wrong:[],msg:['方向鍵／WASD 移動，靠近小小兵按「空白鍵」對話',t+360]};$('#scr').hidden=true;hud()}
function hud(){const i=Math.min(G.cleared,Z.length-1);$('#hud').innerHTML=`<span>關卡 ${i+1}/${Z.length}　${Z[i].title}</span><span>${hearts()}</span>`}

function say(z,text,opts){const d=$('#dlg');d.hidden=false;d.innerHTML=`<img src="assets/characters/${z.npc}.png"><div><div class="nm">${z.role} ${z.nm}</div><div class="tx">${text}</div><div class="op"></div></div>`;
 opts.forEach((o,i)=>{const b=document.createElement('button');b.textContent=(opts.length>1?`${i+1}. `:'')+o.t;b.disabled=!!o.off;b.onclick=o.f;d.querySelector('.op').appendChild(b)})}
const close=()=>{$('#dlg').hidden=true};

function talk(i){const z=Z[i];
 if(i<G.cleared)return say(z,'你已經過關囉，繼續往前走吧！Banana～',[{t:'好',f:close}]);
 G.hearts=3;G.wrong=[];G.qi=0;hud();
 if(i===0&&!G.country)return say(z,z.hi,D.countries.map(c=>({t:`${c.flag} ${c.name}`,f:()=>{G.country=c;talk(0)}})));
 G.qs=pickQ(i===0?G.country.questions:D.stages.find(s=>s.id===z.id).questions,i===0?2:3);
 say(z,i===0?`好選擇！${G.country.name}有幾個常見的入境小問題，我來考考你 ${G.qs.length} 題～`:z.hi,[{t:'開始挑戰',f:()=>ask(i)}])}
function ask(i){const z=Z[i],q=G.qs[G.qi];
 say(z,`<b>第 ${G.qi+1}/${G.qs.length} 題</b>　${hearts()}<br>${q.q}`,rnd(q.options.map((t,k)=>({t,k}))).map(x=>({t:x.t,off:G.wrong.includes(x.k),f:()=>answer(i,q,x.k)})))}
function answer(i,q,k){const z=Z[i];
 if(k===q.answer){mark(q);
  G.log.push({s:i,q:q.q,a:q.options[q.answer],why:q.wrong.replace(/^[^！。]*[！。]\s*/,''),src:q.src,miss:G.wrong.length,re:q.recheck});
  G.wrong=[];G.qi++;const last=G.qi>=G.qs.length,c=G.country;
  const warn=i===0&&c.expires&&Date.now()>new Date(c.expires+'T23:59:59')?'<br><small>⚠ 此規定可能已更新，請以官方公告為準。</small>':'';
  return say(z,q.right+warn,[{t:last?'完成這一關':'下一題',f:last?()=>pass(i):()=>ask(i)}])}
 G.hearts--;G.wrong.push(k);hud();
 if(G.hearts<=0){G.log=G.log.filter(e=>e.s!==i);return say(z,`${q.wrong}<br>愛心用完了，這關要重新挑戰一次，加油！`,[{t:'重新挑戰',f:()=>talk(i)}])}
 say(z,`${q.wrong}<br>扣 1 顆愛心，還剩 ${G.hearts} 顆～`,[{t:'再試一次',f:()=>ask(i)}])}
function pass(i){G.cleared=i+1;G.hearts=3;close();hud();
 if(i===Z.length-1)return setTimeout(ending,400);G.msg=['✔ 通過！前方的柵欄打開了',t+240]}

function ending(){screen(`<h1>🎉 旅途平安！</h1><p>你完成了所有出境關卡，祝你一路順風！<br>Bello～Poopaye！</p><img src="assets/characters/${G.ch}.png" height="190"><div><button onclick="handbook()">查看出境手冊</button><button onclick="select()">再玩一次</button></div>`)}
function handbook(){const nm=PL.find(p=>p[0]===G.ch)[1];
 const body=Z.map((z,i)=>{const L=G.log.filter(e=>e.s===i);return L.length?`<h3>${i+1}. ${z.title}（${z.role} ${z.nm}）</h3>`+L.map(e=>`<p><b>Q：</b>${e.q}<br><b>A：</b>${e.a}${e.miss?`（曾答錯 ${e.miss} 次）`:''}<br><small>${e.why}<br>來源：<a href="${e.src}" target="_blank">${e.src}</a>${e.re?'（待再確認）':''}</small></p>`).join(''):''}).join('');
 screen(`<div id="hb"><h1>出境手冊</h1><p>旅客：${nm}　目的地：${G.country.flag} ${G.country.name}　日期：${new Date().toLocaleDateString('zh-TW')}</p>${body}<p><small>題庫查證日期：${D.verified_on}。規定可能隨時更新，出發前請以官方公告為準。</small></p><p class="noprint"><button onclick="print()">列印／存成 PDF</button><button onclick="select()">再玩一次</button></p></div>`,'hbs')}

function move(){const dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0),n=dx&&dy?.7:1;
 G.moving=!!(dx||dy);if(dx)G.face=dx;
 G.x=Math.max(30,Math.min(G.x+dx*3.4*n,limit()));G.y=Math.max(NY+40,Math.min(G.y+dy*3.4*n,H-20));
 near=-1;Z.forEach((z,i)=>{if(Math.abs(G.x-nx(i))<130&&Math.abs(G.y-NY)<130)near=i})}
function spr(n,x,y,h,fl,bob){const im=IMG[n];if(!im.naturalWidth)return;const w=im.naturalWidth/im.naturalHeight*h;
 ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(x,y,w*.4,8,0,0,7);ctx.fill();
 ctx.save();ctx.translate(x,y-(bob||0));if(fl<0)ctx.scale(-1,1);ctx.drawImage(im,-w/2,-h,w,h);ctx.restore()}
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)},E=(x,y,rx,ry,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill()};
const ICON=['🧭','🎫','🧳','🔍','🛂','🛍️','🛫','💺'],COL=['#e76f51','#2a9d8f','#e9c46a','#8d6cd6','#4aa3df'];

function floorMarks(x,z){ctx.save();ctx.strokeStyle='#ffffffaa';ctx.lineWidth=3;ctx.setLineDash([16,12]);ctx.beginPath();ctx.moveTo(x,425);ctx.lineTo(x+ZW,425);ctx.stroke();ctx.restore();
 ctx.fillStyle='#f2c50099';for(let k=0;k<4;k++){const ax=x+80+k*170;ctx.beginPath();ctx.moveTo(ax,470);ctx.lineTo(ax+34,470);ctx.lineTo(ax+34,460);ctx.lineTo(ax+58,478);ctx.lineTo(ax+34,496);ctx.lineTo(ax+34,486);ctx.lineTo(ax,486);ctx.fill()}
 ctx.fillStyle='#0000001c';ctx.font='700 26px sans-serif';ctx.fillText(z.title+' →',x+ZW/2,525)}
function trolley(x,y){E(x+22,y+2,26,4,'#0003');R(x,y-8,42,5,'#9aa4ae');R(x+38,y-38,4,32,'#9aa4ae');R(x+4,y-30,28,22,'#e76f51');R(x+9,y-46,18,16,'#2a9d8f');E(x+8,y,4,4,'#333');E(x+34,y,4,4,'#333')}
const TC=['#e76f51','#2a9d8f','#8d6cd6','#4aa3df','#e9c46a','#d86aa6'],HC=['#3b2a1e','#111','#a0522d','#e6c27a'];
function trav(x,y,k,dir,ph){const b=Math.abs(Math.sin(ph))*3,c=TC[k%6];E(x,y,13,4,'#0003');R(x-6,y-17+b/2,5,17,'#334');R(x+1,y-17-b/2,5,17,'#334');
 R(x-9,y-42-b,18,27,c);E(x,y-50-b,8,9,'#f1c9a0');R(x-8,y-60-b,16,6,HC[k%4]);R(x+dir*13-6,y-20,12,18,TC[(k+2)%6]);R(x+dir*13-1,y-28,2,8,'#555')}
function room(i,x,z){R(x,0,ZW,H,z.color);R(x,0,ZW,170,'#eef3f8');
 for(let r=0;r<6;r++)for(let c=0;c<10;c++)if((r+c)%2)R(x+c*70,170+r*70,70,70,'#ffffff55');
 R(x,160,ZW,10,'#9fb0c4');floorMarks(x,z);for(let k=0;k<4;k++)R(x+50+k*170,8,100,8,'#fff6b8');
 R(x+ZW/2-160,22,320,54,'#14305c');ctx.fillStyle='#fff';ctx.font='700 24px sans-serif';ctx.fillText(`${ICON[i]} ${z.title}`,x+ZW/2,58)}
function back(i,c,x){switch(i){
 case 0:R(x+50,92,150,64,'#5aa0d8');E(x+95,120,22,16,'#6cc070');E(x+150,130,28,14,'#6cc070');R(x+600,120,30,40,'#8a5a2b');E(x+615,105,28,26,'#2e9e4f');break;
 case 1:R(c-210,90,420,56,'#0a1a33');for(let k=0;k<4;k++){R(c-195,98+k*12,60+k*20,6,'#ffd400');R(c-60,98+k*12,90,6,'#6cf')}
  for(const d of[-250,250]){R(c+d-60,246,120,44,'#c9873a');R(c+d-14,214,48,32,'#223');R(c+d-10,218,40,22,'#6cf')}break;
 case 2:R(x+40,100,620,8,'#555');for(let k=0;k<6;k++)R(x+60+k*100,112,60,34,COL[k%5]);break;
 case 3:R(x+90,180,14,120,'#778');R(x+250,180,14,120,'#778');R(x+90,170,174,14,'#778');R(x+130,215,90,30,'#33a');for(let k=0;k<3;k++)R(x+520+k*40,270,34,20,'#b8c2cc');break;
 case 4:R(x+60,400,ZW-120,6,'#f2c500');for(let k=0;k<6;k++)R(x+80+k*100,420,6,40,'#555');break;
 case 5:for(const sx of[x+40,x+490])for(let r=0;r<3;r++){R(sx,100+r*22,170,5,'#8a6d3b');for(let k=0;k<7;k++)R(sx+6+k*24,80+r*22,14,20,COL[(k+r)%5])}break;
 case 6:R(x+40,86,620,70,'#8fd0ff');E(x+330,124,80,10,'#fff');ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x+320,124);ctx.lineTo(x+360,152);ctx.lineTo(x+345,124);ctx.fill();ctx.beginPath();ctx.moveTo(x+255,124);ctx.lineTo(x+250,104);ctx.lineTo(x+272,124);ctx.fill();
  for(const sx of[x+40,x+480])for(let k=0;k<4;k++)R(sx+k*42,212,36,32,'#2a6fd6');break;
 case 7:R(x,104,ZW,22,'#d7dbe2');for(let k=0;k<6;k++)E(x+80+k*110,148,20,12,'#bfe3ff');R(x+30,200,150,70,'#1f4e9c');R(x+520,200,150,70,'#1f4e9c');break}}
function front(i,c){switch(i){
 case 0:R(c-110,252,220,52,'#2a6fd6');R(c-120,244,240,12,'#8fb8f5');E(c,278,13,13,'#fff');ctx.fillStyle='#2a6fd6';ctx.font='700 20px sans-serif';ctx.fillText('i',c,285);break;
 case 1:R(c-100,252,200,52,'#c9873a');R(c-110,244,220,12,'#e8b26a');R(c+50,214,44,30,'#223');R(c+54,218,36,20,'#6cf');break;
 case 2:R(c-300,258,600,34,'#3a3a3a');for(let k=0;k<30;k++)R(c-296+k*20,260,4,30,'#555');for(const b of[[-230,0],[-150,1],[150,2],[230,3]])R(c+b[0]-28,230,56,30,COL[b[1]]);break;
 case 3:R(c-140,244,280,58,'#5a6b7d');R(c-120,260,240,34,'#111');R(c-132,260,10,34,'#5bc0ff');R(c+122,260,10,34,'#5bc0ff');break;
 case 4:R(c-110,230,220,76,'#9fd3e8cc');R(c-112,226,224,6,'#2b4a6b');R(c-110,284,220,22,'#2b4a6b');break;
 case 5:R(c-100,254,200,50,'#e07aa5');R(c-110,246,220,12,'#f5b3cd');R(c+40,222,36,26,'#334');break;
 case 6:R(c-80,250,160,54,'#e0e6ee');R(c-90,244,180,10,'#b8c2cc');ctx.fillStyle='#14305c';ctx.font='700 22px sans-serif';ctx.fillText('B7',c,290);break;
 case 7:R(c-70,254,140,50,'#aab4c0');R(c-80,246,160,10,'#cfd6de');R(c+40,226,8,22,'#778');break}}
function draw(){cam=Math.max(0,Math.min(G.x-W/2,Z.length*ZW-W));ctx.clearRect(0,0,W,H);ctx.textAlign='center';
 Z.forEach((z,i)=>{const x=i*ZW-cam;if(x>W||x+ZW<0)return;room(i,x,z);back(i,x+ZW/2,x)});
 for(let i=1;i<Z.length;i++)if(i>G.cleared){const x=i*ZW-cam;ctx.fillStyle='#d22';ctx.fillRect(x-6,FLOOR-20,12,H);ctx.fillStyle='#fff';for(let y=FLOOR;y<H;y+=40)ctx.fillRect(x-6,y,12,18);ctx.font='20px sans-serif';ctx.fillText('🔒',x,FLOOR+10)}
 const ents=[];Z.forEach((z,i)=>{const x=i*ZW-cam;if(x>W||x+ZW<0)return;
  ents.push({y:NY,f:()=>{spr(z.npc,nx(i)-cam,NY,120,1,0);ctx.font='700 15px sans-serif';const tw=ctx.measureText(`${z.role} ${z.nm}`).width+16;R(nx(i)-cam-tw/2,NY-150,tw,22,'#14305cdd');ctx.fillStyle='#fff';ctx.fillText(`${z.role} ${z.nm}`,nx(i)-cam,NY-134);
   if(i===G.cleared){ctx.fillStyle='#e22';ctx.font='700 34px sans-serif';ctx.fillText('!',nx(i)-cam,NY-158+Math.sin(t/8)*5)}}});
  ents.push({y:NY+1,f:()=>front(i,x+ZW/2)})});
 Z.forEach((z,i)=>{const x=i*ZW-cam;if(x>W||x+ZW<0)return;
  if([0,1,2,5,6].includes(i)){ents.push({y:236,f:()=>trolley(x+30,236)});ents.push({y:236,f:()=>trolley(x+ZW-80,236)})}
  if(i<2)ents.push({y:520,f:()=>trolley(x+ZW-130,520)});
  for(let k=0;k<3;k++){const sd=i*7+k,sp=.5+(sd%3)*.25,dr=sd%2?1:-1,ly=[212,230,478][k],L=ZW+120,lx=(((t*sp*dr+sd*210)%L)+L)%L-60;ents.push({y:ly,f:()=>trav(x+lx,ly,sd,dr,t/5*sp+sd)})}});
 ents.push({y:G.y,f:()=>spr(G.ch,G.x-cam,G.y,110,G.face,G.moving?Math.abs(Math.sin(t/4))*6:0)});
 ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
 ctx.font='700 18px sans-serif';
 if(near>=0&&$('#dlg').hidden&&$('#scr').hidden){ctx.fillStyle='#000a';ctx.fillRect(W/2-120,H-46,240,32);ctx.fillStyle='#fff';ctx.fillText(near<=G.cleared?'按「空白鍵」跟他對話':'先完成前面的關卡',W/2,H-24)}
 if(G.msg&&t<G.msg[1]){ctx.fillStyle='#000a';ctx.fillRect(W/2-250,90,500,34);ctx.fillStyle='#ffd400';ctx.fillText(G.msg[0],W/2,113)}}
function loop(){t++;if(G&&$('#scr').hidden){if($('#dlg').hidden)move();draw()}requestAnimationFrame(loop)}

addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(!$('#scr').hidden)return;
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
